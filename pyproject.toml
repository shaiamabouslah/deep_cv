[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["notebooks", ".venv-orchestrator", "mlartifacts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E731", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = ["src/backfill_mlflow.py", "src/build_*.py", "src/compare_variants.py"]

[tool.ruff.lint.per-file-ignores]
"src/serve.py" = ["E402", "I001"]
