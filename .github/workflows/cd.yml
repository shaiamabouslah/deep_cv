name: CD

# Delivers the service as a container image to GitHub's registry (ghcr.io).
#   - every successful CI run on main publishes :main and :<short sha>
#   - a version tag (v1.2.0) publishes :1.2.0 and :latest
# The image is smoke-tested before it is pushed. Model weights are versioned
# with DVC, not git: when the repository secret DVC_REMOTE_URL (with its
# credentials) is set, `dvc pull` brings the weights into the build; without
# it the image serves the fallback model and says so on /health.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      HAS_DVC_REMOTE: ${{ secrets.DVC_REMOTE_URL != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Fetch model weights from the DVC remote
        if: env.HAS_DVC_REMOTE == 'true'
        run: |
          pip install "dvc>=3,<4"
          dvc remote modify --local storage url "${{ secrets.DVC_REMOTE_URL }}"
          dvc pull models/model.pt

      - name: Prepare the build context
        run: mkdir -p models

      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=main,enable=${{ github.event_name == 'workflow_run' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short

      - uses: docker/setup-buildx-action@v3

      - name: Build (local) and smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: water-monitoring:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 water-monitoring:candidate
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 3; done
          curl -sf http://127.0.0.1:8000/health
          curl -sf http://127.0.0.1:8000/metrics | grep -q http_requests_total

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
