name: CT health check

# Continuous training runs where the data and the models live: the Prefect
# flow `continuous-training` (orchestration/flows.py), scheduled weekly by
# orchestration/deploy.py, which retrains when monitoring reports drift or a
# forecaster that no longer beats the no-change baseline, and replaces the
# live segmentation model only if the promotion gate accepts the candidate.
#
# A GitHub runner has neither the satellite data nor the production
# monitoring database, so it cannot retrain. What it can do, and does here
# every Monday and on demand, is prove the CT machinery itself still works:
# the flow's retry / failure-hook / decision logic runs against Prefect's
# test harness, and the drift, promotion-gate and registry logic against
# their unit tests. A broken CT pipeline is found now, not the day a model
# degrades.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  orchestration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-orchestration.txt
      - run: pip install -r requirements-orchestration.txt pytest
      - name: Flow tests (retries, failure hooks, retraining decision, gate)
        run: pytest -v tests/test_orchestration.py

  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
      - name: Drift, promotion gate, registry
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: pytest -v tests/test_monitoring.py tests/test_finetune_promote.py tests/test_tracking_registry.py
